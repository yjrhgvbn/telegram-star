[package]
name = "telegram-star-mobile"
version = "0.1.0"
description = "Telegram Star mobile shell"
authors = ["Telegram Star"]
edition = "2021"

[lib]
name = "telegram_star_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
