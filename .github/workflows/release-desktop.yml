name: Build Desktop Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing version tag to build, for example v0.0.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            extensions: .dmg
          - name: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            extensions: .dmg
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            extensions: .exe
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            extensions: .AppImage,.deb
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out version tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true

      - name: Check version consistency
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-version.mjs --check "$RELEASE_TAG"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libappindicator3-dev libxdo-dev libssl-dev librsvg2-dev patchelf xdg-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Cargo Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Generate platform icons from the existing app icon
        working-directory: packages/desktop
        run: |
          cargo tauri icon ../web/public/icons/icon-512.png --output src-tauri/icons
          node <<'NODE'
          const fs = require('node:fs');
          // The checked-in PNGs remain the source; native installers also need ICO/ICNS.
          fs.writeFileSync('src-tauri/tauri.release.conf.json', JSON.stringify({
            bundle: {
              createUpdaterArtifacts: false,
              icon: ['icons/32x32.png', 'icons/128x128.png', 'icons/128x128@2x.png', 'icons/icon.icns', 'icons/icon.ico'],
            },
          }, null, 2));
          NODE

      - name: Build native installers
        id: build
        uses: tauri-apps/tauri-action@v1
        env:
          # Ad-hoc signing permits Apple Silicon builds without a developer certificate.
          # These builds are not notarized; Windows installers are also unsigned.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: packages/desktop
          tauriScript: cargo tauri
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json -- --locked
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Collect installers with unambiguous filenames
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PLATFORM: ${{ matrix.name }}
          RELEASE_EXTENSIONS: ${{ matrix.extensions }}
          TAURI_ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const artifacts = JSON.parse(process.env.TAURI_ARTIFACT_PATHS || '[]');
          fs.mkdirSync('release-assets', { recursive: true });
          for (const extension of process.env.RELEASE_EXTENSIONS.split(',')) {
            const matches = artifacts.filter(file => file.endsWith(extension) && fs.statSync(file).isFile());
            if (matches.length !== 1) {
              throw new Error(`Expected one ${extension} installer, found ${matches.length}`);
            }
            // Explicit platform names prevent the two macOS jobs overwriting assets.
            const filename = `telegram-star-${process.env.RELEASE_TAG}-${process.env.RELEASE_PLATFORM}${extension}`;
            fs.copyFileSync(matches[0], path.join('release-assets', filename));
          }
          NODE

      - name: Upload installers for the release job
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
