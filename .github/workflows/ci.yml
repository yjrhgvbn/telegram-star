name: CI

on:
  # Release tags run the checks in release.yml; this workflow is for manual checks.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and validate migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI uses disposable data and never receives Telegram credentials or a saved session.
      TELEGRAM_API_ID: ""
      TELEGRAM_API_HASH: ""
      HOST: 127.0.0.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true

      - name: Prepare isolated runtime data
        shell: bash
        run: |
          set -euo pipefail
          # Runner paths are available at step execution, not in job-level env expressions.
          runtime_data_dir="$RUNNER_TEMP/telegram-star-ci"
          mkdir -p "$runtime_data_dir"
          : > "$runtime_data_dir/session.txt"
          {
            echo "DATABASE_URL=file:$runtime_data_dir/telegram-star.db"
            echo "DB_PATH=$runtime_data_dir/telegram-star.db"
            echo "SESSION_PATH=$runtime_data_dir/session.txt"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Check release tooling and version consistency
        run: |
          pnpm test:release
          pnpm release:check

      - name: Validate database migrations
        run: pnpm db:deploy

      - name: Build standalone demo
        run: pnpm build:demo
