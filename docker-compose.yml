services:
  telegram-star:
    # Pin a published version (or digest) so upgrades are deliberate.
    image: ${TELEGRAM_STAR_IMAGE:-docker.io/yjrhgvbn/telegram-star:0.0.1}
    container_name: telegram-star
    restart: unless-stopped
    init: true
    mem_limit: ${TELEGRAM_STAR_MEMORY_LIMIT:-1536m}
    pids_limit: 256
    stop_grace_period: 30s
    # 每个容器最多保留约 200MB 原始日志；local 驱动会自动轮转并压缩旧文件。
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "10"
    ports:
      - "3000:3000"
    volumes:
      - telegram-star-data:/app/data
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=file:/app/data/telegram-star.db
      - DB_PATH=/app/data/telegram-star.db
      - SESSION_PATH=/app/data/session.txt
      - CORS_ORIGIN=*
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GRAMJS_LOG_LEVEL=${GRAMJS_LOG_LEVEL:-warn}
      - NODE_OPTIONS=--max-old-space-size=${NODE_MAX_OLD_SPACE_SIZE_MB:-768}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  telegram-star-data:
